<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Licensed fonts — download from the sites you use, place the files in
     the /fonts folder next to this HTML file, matching these filenames
     (whichever extension you actually have is fine, just drop in one). */
  @font-face {
    font-family: 'Autography';
    src: url('fonts/Autography.otf') format('opentype'),
         url('fonts/Autography.ttf') format('truetype'),
         url('fonts/Autography.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'KG Teacher Jordan';
    src: url('fonts/KGTeacherJordan.otf') format('opentype'),
         url('fonts/KGTeacherJordan.ttf') format('truetype'),
         url('fonts/KGTeacherJordan.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --cream:#FBF6F0; --card:#FFFFFF;
    --blush:#F3DCD9; --blush-deep:#E9C3BE;
    --sage:#DCE8DD; --sage-deep:#C3D9C6;
    --lavender:#E9DFEE; --lavender-deep:#D8C7E1;
    --butter:#F6E8C9;
    --ink:#4A3B35; --ink-soft:#8A776E; --line:#EADFD5;
    --shadow: 0 6px 20px rgba(120,96,80,0.08);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:#EFE7DC; font-family:'Quicksand',sans-serif; color:var(--ink); }
  .fdisp{ font-family:'Autography','Architects Daughter',cursive; } .fhand{ font-family:'KG Teacher Jordan','Patrick Hand',cursive; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }

  #app{ display:flex; min-height:100vh; }

  /* ---- sidebar ---- */
  #sidebar{
    width:210px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
    display:flex; flex-direction:column; transition:width .2s ease; overflow:hidden;
  }
  #sidebar.collapsed{ width:64px; }
  .side-head{ display:flex; align-items:center; gap:10px; padding:18px 16px; }
  .side-logo{ font-family:'Autography','Architects Daughter'; font-weight:700; font-size:26px; white-space:nowrap; }
  .side-toggle{
    margin-left:auto; width:28px;height:28px; border:none; background:var(--sage); border-radius:8px; font-size:13px; flex-shrink:0;
  }
  .side-nav{ display:flex; flex-direction:column; gap:2px; padding:6px 10px; overflow-y:auto; flex:1; }
  .side-btn{
    display:flex; align-items:center; gap:12px; border:none; background:transparent; text-align:left;
    padding:11px 12px; border-radius:12px; font-weight:600; font-size:13.5px; color:var(--ink-soft); white-space:nowrap;
  }
  .side-btn .ic{ font-size:16px; width:20px; text-align:center; flex-shrink:0; }
  .side-btn.active{ background:var(--ink); color:var(--cream); }
  .side-btn:hover:not(.active){ background:var(--blush); color:var(--ink); }

  #main-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #main-content{ flex:1; padding:28px 32px 60px; max-width:960px; width:100%; margin:0 auto; }

  @media (max-width:800px){
    #sidebar{ position:fixed; z-index:40; height:100vh; width:210px; transform:translateX(-100%); transition:transform .2s ease; }
    #sidebar.mobile-open{ transform:translateX(0); }
    #sidebar.collapsed{ width:210px; }
    #main-content{ padding:20px 16px 60px; }
  }

  .section-label{ font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px 2px; }
  .card{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; }
  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; background:var(--sage); color:#3E6B47; }
  .pill.lav{ background:var(--lavender); color:#6B4E7A; } .pill.blush{ background:var(--blush); color:#B9603F; } .pill.butter{ background:var(--butter); color:#8A6A1E; }
  .btn{ border:none; border-radius:12px; padding:10px 16px; font-weight:700; font-size:13px; }
  .btn-primary{ background:var(--ink); color:var(--cream); }
  .btn-secondary{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-danger{ background:var(--blush); color:#a04a3a; }
  .btn-sm{ padding:6px 11px; font-size:11.5px; border-radius:9px; }
  .row{ display:flex; align-items:center; }
  .gap8{ gap:8px; } .gap10{ gap:10px; } .gap12{ gap:12px; }
  .between{ justify-content:space-between; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid2{ grid-template-columns:1fr; } }
  .field-label{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; display:block; }
  .field{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px; background:#fff; color:var(--ink); }
  textarea.field{ resize:vertical; min-height:70px; }
  hr.dash{ border:none; border-top:1.5px dashed var(--line); margin:16px 0; }

  /* ---- hero / greeting ---- */
  .hero{ padding:24px 26px; border-radius:22px; background:radial-gradient(120% 130% at 15% 0%, #F8DFC9 0%, #F3CBCE 45%, #E6D7EA 80%, var(--cream) 100%); margin-bottom:22px; }
  .hero h1{ font-family:'Autography','Architects Daughter'; font-weight:700; font-size:38px; margin:0 0 2px; }
  .hero .sub{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .affirmation{ margin-top:14px; background:rgba(255,255,255,0.6); border-radius:14px; padding:11px 13px; font-family:'KG Teacher Jordan','Patrick Hand'; font-size:14px; }

  .dash-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
  @media (max-width:800px){ .dash-grid{ grid-template-columns:1fr; } }
  .stack{ display:flex; flex-direction:column; gap:20px; }

  .meal-strip{ display:flex; gap:10px; overflow-x:auto; }
  .meal-card{ min-width:130px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; flex-shrink:0; cursor:pointer; }
  .meal-card .img{ height:56px; background:linear-gradient(135deg,var(--sage),var(--sage-deep)); position:relative; overflow:hidden; }
  .meal-card .info{ padding:8px 10px 10px; }
  .meal-card .day{ font-size:9.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; }
  .meal-card .dish{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:13.5px; margin-top:2px; line-height:1.25; }

  .stock-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-family:'KG Teacher Jordan','Patrick Hand'; font-size:14px; }
  .stock-row:last-child{ border-bottom:none; }

  /* ---- recipes list ---- */
  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .filter-chip{ border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:600; color:var(--ink-soft); }
  .filter-chip.active{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .recipe-tile{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; cursor:pointer; }
  .recipe-tile .img{ height:100px; background:linear-gradient(135deg,var(--blush),var(--lavender)); position:relative; overflow:hidden; }
  .recipe-tile .info{ padding:11px 13px 13px; }
  .recipe-tile .title{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:15px; line-height:1.25; margin-bottom:6px; }
  .recipe-tile .tagrow{ display:flex; gap:5px; flex-wrap:wrap; }

  /* ---- recipe detail ---- */
  .recipe-header-banner{ height:130px; border-radius:20px; background:linear-gradient(135deg,#F8DFC9,var(--blush) 55%,var(--lavender)); margin-bottom:16px; position:relative; overflow:hidden; }
  .img img, .thumb img, .recipe-header-banner img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .fav-row{ display:flex; gap:16px; margin-bottom:8px; }
  .fav-person{ display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; background:none; border:none; }
  .fav-person .name{ font-size:10px; color:var(--ink-soft); font-weight:600; }
  .heart{ width:22px;height:22px; }
  .rtitle{ font-family:'Autography','Architects Daughter'; font-weight:700; font-size:32px; margin:6px 0 0; }
  .rsource{ font-size:12px; color:#B98A78; }
  .timing-row{ display:flex; gap:10px; margin:14px 0; }
  .timing-chip{ flex:1; background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:9px; text-align:center; }
  .timing-chip .lbl{ font-size:9.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; }
  .timing-chip .val{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:15px; }

  table.ing{ width:100%; border-collapse:collapse; font-family:'KG Teacher Jordan','Patrick Hand'; font-size:13.5px; }
  table.ing th{ text-align:left; font-family:'Quicksand'; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); border-bottom:1.5px solid var(--line); padding-bottom:6px; }
  table.ing td{ padding:7px 4px; border-bottom:1px solid var(--line); }
  .step-time{ font-weight:700; color:#3E6B47; font-family:'Quicksand'; font-size:12px; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:3px; }

  .step-item{ display:flex; gap:12px; padding-bottom:14px; }
  .step-num{ width:24px;height:24px;border-radius:50%; background:var(--sage); color:#3E6B47; font-weight:700; font-size:11.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step-text{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:14px; line-height:1.45; }

  details.collapsible{ border-radius:16px; background:var(--card); box-shadow:var(--shadow); overflow:hidden; margin-bottom:12px; }
  details.collapsible summary{ list-style:none; cursor:pointer; padding:13px 16px; font-family:'KG Teacher Jordan','Patrick Hand'; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  details.collapsible summary::-webkit-details-marker{ display:none; }
  details.collapsible .inner{ padding:0 16px 16px; font-family:'KG Teacher Jordan','Patrick Hand'; font-size:13.5px; line-height:1.55; }
  .disclaimer{ font-family:'Quicksand'; font-size:11px; color:var(--ink-soft); background:var(--lavender); border-radius:10px; padding:9px 10px; margin-top:10px; }
  .disclaimer.blush{ background:var(--blush); }
  .food-ok{ color:#3E6B47; } .food-bad{ color:#B9603F; } .food-unk{ color:var(--ink-soft); }

  /* ---- inventory ---- */
  .inv-item{ display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:11px 13px; margin-bottom:9px; }
  .inv-star{ font-size:16px; color:var(--line); background:none; border:none; flex-shrink:0; }
  .inv-star.on{ color:#D9A441; }
  .inv-main{ flex:1; min-width:0; }
  .inv-name{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:14.5px; }
  .inv-meta{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .inv-meta.warn{ color:#B9603F; font-weight:600; }
  .stepper{ display:flex; align-items:center; gap:6px; }
  .stepper button{ width:24px;height:24px;border-radius:7px; border:1.5px solid var(--line); background:#fff; font-size:14px; }
  .stepper .qty{ font-weight:700; font-size:13px; min-width:16px; text-align:center; }

  /* ---- meal plan ---- */
  .day-strip{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
  .day-chip{ flex-shrink:0; width:52px; text-align:center; padding:9px 0 8px; border-radius:14px; background:var(--card); box-shadow:var(--shadow); border:none; }
  .day-chip .dow{ font-size:10px; color:var(--ink-soft); font-weight:700; }
  .day-chip .dom{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:16px; }
  .day-chip.active{ background:var(--ink); }
  .day-chip.active .dow,.day-chip.active .dom{ color:var(--cream); }
  .meal-slot{ display:flex; gap:12px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:12px; margin-bottom:12px; cursor:pointer; align-items:center; }
  .meal-slot .thumb{ width:52px;height:52px;border-radius:12px; flex-shrink:0; background:linear-gradient(135deg,var(--sage),var(--sage-deep)); position:relative; overflow:hidden; }
  .meal-slot .body{ flex:1; min-width:0; }
  .meal-slot .slot-label{ font-size:10px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; }
  .meal-slot .slot-title{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:15px; }
  .meal-slot.empty .slot-title{ color:var(--ink-soft); font-family:'Quicksand'; font-size:13px; }
  .meal-slot.empty .thumb{ background:none; border:1.5px dashed var(--line); display:flex;align-items:center;justify-content:center; color:var(--ink-soft); }
  .meal-group{ margin-bottom:16px; }
  .meal-subslot{ display:flex; align-items:center; gap:10px; margin:6px 0 0 26px; padding:9px 12px; border-radius:12px; background:rgba(255,255,255,0.55); cursor:pointer; }
  .meal-subslot .sub-ic{ font-size:15px; width:20px; text-align:center; flex-shrink:0; }
  .meal-subslot .sub-body{ flex:1; min-width:0; }
  .meal-subslot .sub-label{ font-size:9.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .meal-subslot .sub-title{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:13.5px; }
  .meal-subslot.empty .sub-title{ color:var(--ink-soft); font-family:'Quicksand'; font-size:12px; }

  /* ---- family ---- */
  .fam-card{ display:flex; align-items:center; gap:14px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px; }
  .fam-avatar{ width:44px;height:44px;border-radius:50%; background:linear-gradient(135deg,var(--blush),var(--lavender)); display:flex;align-items:center;justify-content:center; font-family:'Autography','Architects Daughter'; font-weight:700; font-size:20px; flex-shrink:0; }
  .fam-main{ flex:1; min-width:0; }
  .fam-name{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:15.5px; }
  .fam-meta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(60,47,42,0.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-box{ background:var(--cream); border-radius:22px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:22px; }
  .modal-title{ font-family:'Autography','Architects Daughter'; font-weight:700; font-size:26px; margin:0 0 14px; }
  .close-x{ position:absolute; top:14px; right:16px; background:none; border:none; font-size:18px; color:var(--ink-soft); }
  .modal-box{ position:relative; }
  .toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
  .toggle-btn{ flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px; font-weight:700; font-size:12.5px; color:var(--ink-soft); }
  .toggle-btn.active{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .spinner{ display:inline-block; width:14px;height:14px; border:2px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .err-msg{ font-size:12px; color:#B9603F; background:var(--blush); border-radius:9px; padding:8px 10px; margin-top:8px; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-family:'Autography','Architects Daughter'; font-size:26px; color:var(--ink); }

  .topbar-mobile{ display:none; padding:14px 16px; align-items:center; gap:10px; background:var(--card); border-bottom:1px solid var(--line); }
  @media (max-width:800px){ .topbar-mobile{ display:flex; } }
  .hamburger{ background:none; border:none; font-size:20px; }
  .overlay-bg{ display:none; }
  @media (max-width:800px){ .overlay-bg.show{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.25); z-index:35; } }

  /* ---- shopping / checklist / progress ---- */
  .shop-row{ display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:11px 13px; margin-bottom:8px; }
  .shop-check{ width:22px;height:22px;border-radius:7px; border:1.5px solid var(--line); background:#fff; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:12px; }
  .shop-check.done{ background:var(--sage-deep); border-color:var(--sage-deep); color:#3E6B47; }
  .shop-name{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:14.5px; flex:1; }
  .shop-name.done{ text-decoration:line-through; color:var(--ink-soft); }
  .cat-label{ font-family:'Quicksand'; font-weight:700; font-size:11.5px; color:#6B4E7A; margin:18px 2px 8px; text-transform:uppercase; letter-spacing:.06em; }
  .cat-label:first-child{ margin-top:0; }

  .progress-track{ height:10px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,#D8A6C9,#C98B7A); }
  .goal-card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px; }
  .goal-top{ display:flex; justify-content:space-between; font-family:'KG Teacher Jordan','Patrick Hand'; font-size:14.5px; margin-bottom:6px; }
  .goal-top .amt{ font-size:12px; color:var(--ink-soft); }

  .food-date-input{ font-family:'Quicksand'; font-size:11px; border:1px solid var(--line); border-radius:8px; padding:5px 7px; width:110px; }

  .storage-col{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; }
  .storage-col .h{ font-weight:700; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .storage-col .item{ font-family:'KG Teacher Jordan','Patrick Hand'; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--line); }
  .storage-col .item:last-child{ border-bottom:none; }

  .tag-input-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tag-chip-x{ display:inline-flex; align-items:center; gap:5px; background:var(--sage); color:#3E6B47; font-size:11px; font-weight:700; padding:4px 8px 4px 10px; border-radius:999px; }
  .tag-chip-x button{ background:none; border:none; color:#3E6B47; font-size:11px; padding:0; }
</style>
</head>
<body>

<div id="app">
  <div class="overlay-bg" id="mobileOverlay"></div>
  <aside id="sidebar">
    <div class="side-head">
      <span class="side-logo">Pour</span>
      <button class="side-toggle" id="sideToggle">‹</button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
  </aside>
  <div id="main-wrap">
    <div class="topbar-mobile">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <span class="fdisp" style="font-size:22px;font-weight:700;">Pour</span>
    </div>
    <main id="main-content"></main>
  </div>
</div>
<div id="modal-root"></div>

<script>
/* ============================= DATA ============================= */
const STORAGE_KEY = 'pour-app-state';
const NAV = [
  {id:'dashboard', label:'Home', ic:'🏡'},
  {id:'recipes', label:'Recipes', ic:'📖'},
  {id:'mealplan', label:'Meal Plan', ic:'🗓️'},
  {id:'prepday', label:'Prep Day', ic:'🔪'},
  {id:'shopping', label:'Shopping List', ic:'🛒'},
  {id:'inventory', label:'Inventory', ic:'🧺'},
  {id:'firstfoods', label:'First Foods', ic:'🍼'},
  {id:'nutrition', label:'Nutrition Goals', ic:'📊'},
  {id:'seasonal', label:'Seasonal & Holiday', ic:'🍂'},
  {id:'settings', label:'Settings', ic:'⚙️'},
];

const FOOD_REFERENCE = {
  chicken:{ baby:{6:'Shred finely, moisten with broth or cooking liquid. Avoid the skin.',12:'Soft shredded strips.',18:'Diced, tender-cooked pieces.',24:'Cut small, same as adult prep.'}, puppy:{safe:true, note:'Plain, unseasoned, no bones.'} },
  turkey:{ baby:{6:'Well-cooked and finely shredded.',12:'Soft shredded strips.',18:'Diced pieces.',24:'Cut small.'}, puppy:{safe:true, note:'Plain, unseasoned, no bones.'} },
  beef:{ baby:{8:'Well-cooked, finely shredded or ground, moistened.',12:'Small soft pieces.',18:'Diced tender pieces.',24:'Cut small.'}, puppy:{safe:true, note:'Plain cooked, no seasoning.'} },
  egg:{ baby:{6:'Scrambled soft, or well-cooked and mashed.'}, puppy:{safe:true, note:'Cooked only, no salt/butter.'} },
  rice:{ baby:{6:'Well-cooked, soft, slightly sticky.'}, puppy:{safe:true, note:'Plain, cooked, no seasoning.'} },
  'sweet potato':{ baby:{6:'Steamed and mashed, or soft finger-shaped spears.'}, puppy:{safe:true, note:'Cooked plain, no skin seasoning.'} },
  banana:{ baby:{6:'Mashed, or a short soft stick for BLW.'}, puppy:{safe:true, note:'Small amounts — high in sugar.'} },
  garlic:{ baby:{12:'Small amount, well-cooked into a dish only.'}, puppy:{safe:false, note:'Toxic to dogs — do not share.'} },
  onion:{ baby:{12:'Small amount, well-cooked into a dish only — use caution.'}, puppy:{safe:false, note:'Toxic to dogs — do not share.'} },
  grape:{ baby:{12:'Avoid whole — quarter lengthwise if offering; choking risk.'}, puppy:{safe:false, note:'Toxic to dogs — can cause kidney failure. Never share.'} },

let state = null;

function loadState(){

  }

}
function migrateState(){
  if(!state.shoppingList) state.shoppingList = [];
  if(!state.firstFoods) state.firstFoods = seedFirstFoods();
  if(!state.tasks) state.tasks = [];
  if(state.userNickname===undefined) state.userNickname = '';
  (state.familyMembers||[]).forEach(f=>{
    if(f.weightLbs===undefined) f.weightLbs='';
    if(!f.allergies) f.allergies=[];
    if(f.type==='person'){
      const isYoung = f.ageUnit==='months' || (f.age!=='' && f.age!==undefined && Number(f.age) < 3);
      f.type = isYoung ? 'infant' : 'adult';
    }
    if(f.type==='pet') f.type='other-pet';
    if(!['adult','infant','dog','cat','other-pet'].includes(f.type)) f.type='adult';
    if(f.birthday===undefined || f.birthday===''){
      if(f.age!==undefined && f.age!=='' && Number(f.age) >= 0){
        f.birthday = f.ageUnit==='months' ? birthdayMonthsAgo(Number(f.age)) : birthdayYearsAgo(Number(f.age));
      } else {
        f.birthday = '';
      }
    }
    delete f.age;
    delete f.ageUnit;
  });
  if(!state.ui) state.ui = { currentView:'dashboard', mealPlanDate: todayISO() };
  (state.recipes||[]).forEach(r=>{
    if(!r.seasonalTags) r.seasonalTags = [];
    if(!r.holidayTags) r.holidayTags = [];
    if(r.headerImage===undefined) r.headerImage = '';
  });
  (state.inventory||[]).forEach(i=>{
    if(i.category==='Must-Haves'){ i.category='Pantry'; i.mustHave=true; }
    if(i.category==='Seasonings'){ i.category='Pantry'; i.subCategory='Seasoning'; }
    if(i.subCategory===undefined) i.subCategory='';
    if(!['Pantry','Freezer','Fridge'].includes(i.category)) i.category='Pantry';
  });
  Object.keys(state.mealPlan||{}).forEach(date=>{
    const entry = state.mealPlan[date];
    ['breakfast','lunch','dinner'].forEach(slot=>{
      if(typeof entry[slot] === 'string'){ entry[slot] = {main: entry[slot], baby:null, dog:null}; }
      else if(!entry[slot] || typeof entry[slot] !== 'object'){ entry[slot] = {main:null, baby:null, dog:null}; }
      else { if(entry[slot].main===undefined) entry[slot].main=null; if(entry[slot].baby===undefined) entry[slot].baby=null; if(entry[slot].dog===undefined) entry[slot].dog=null; }
    });
    if(entry.babyMeal){
      if(!entry.dinner.baby) entry.dinner.baby = entry.babyMeal;
      delete entry.babyMeal;
    }
    if(entry.dogMeal){
      if(!entry.dinner.dog) entry.dinner.dog = entry.dogMeal;
      delete entry.dogMeal;
    }
  });
}

/* ============================= ANTHROPIC API ============================= */
async function callClaude(promptText, useWebSearch){
  const body = {
    model:'claude-sonnet-5',
    max_tokens:4000,
    messages:[{role:'user', content: promptText}],
  };
  if(useWebSearch){ body.tools = [{type:'web_search_20260209', name:'web_search'}]; }
  const res = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message || 'API error');
  const text = (data.content||[]).map(b=> b.type==='text' ? b.text : '').filter(Boolean).join('\n');
  return text;
}
function parseJsonLoose(text){
  const cleaned = text.replace(/```json|```/g,'').trim();
  const start = cleaned.indexOf('{'); const end = cleaned.lastIndexOf('}');
  if(start===-1||end===-1){
    const preview = cleaned.slice(0,120).replace(/\s+/g,' ');
    throw new Error(preview ? `Claude didn't return the expected format — it said: "${preview}${cleaned.length>120?'…':''}"` : 'Claude returned an empty response.');
  }
  return JSON.parse(cleaned.slice(start, end+1));
}

  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const tIso = tomorrow.toISOString().slice(0,10);

  if(tEntry && (tEntry.dinner?.main||tEntry.lunch?.main)){
    const r = state.recipes.find(x=>x.id===(tEntry.dinner?.main||tEntry.lunch?.main));

async function tryFetchOgImage(url){
  const proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
  ];
  for(const proxyBase of proxies){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(), 8000);
      const res = await fetch(proxyBase + encodeURIComponent(url), {signal: controller.signal});
      clearTimeout(timeout);
      if(!res.ok) continue;
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const metaNames = ['meta[property="og:image"]','meta[property="og:image:secure_url"]','meta[name="twitter:image"]'];
      for(const sel of metaNames){
        const tag = doc.querySelector(sel);
        const content = tag && tag.getAttribute('content');
        if(content) return new URL(content, url).href;
      }
      const firstImg = doc.querySelector('article img, .recipe img, [class*="recipe"] img, img');
      if(firstImg){
        const src = firstImg.getAttribute('src') || firstImg.getAttribute('data-src');
        if(src) return new URL(src, url).href;
      }
      return '';
    }catch(e){
      continue;
    }
  }
  return '';
}

async function callClaudeWithRetry(prompt, useWebSearch, retries){
  retries = retries===undefined ? 1 : retries;
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{
      return await callClaude(prompt, useWebSearch);
    }catch(e){
      lastErr = e;
      if(i<retries) await new Promise(r=>setTimeout(r, 1200));
    }
  }
  throw lastErr;
}

async function fetchPageContent(url){
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 15000);
    const res = await fetch('/api/fetch-page', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url}), signal: controller.signal
    });
    clearTimeout(timeout);
    if(!res.ok) return '';
    const data = await res.json();
    if(!data.html) return '';
    const doc = new DOMParser().parseFromString(data.html, 'text/html');
    doc.querySelectorAll('script,style,noscript,svg,nav,footer,header,iframe').forEach(el=>el.remove());
    let text = doc.body ? doc.body.textContent : '';
    text = text.replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim();
    if(text.length > 12000) text = text.slice(0, 12000);
    if(text && text.length > 200) return text;
    return '';
  }catch(e){
    return '';
  }
}

  if(!url){ statusEl.innerHTML = '<div class="err-msg">Please paste a recipe URL.</div>'; return; }
  statusEl.innerHTML = '<div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Reading the page…</div>';
  const formatInstructions = `

INGREDIENTS: Capitalize each word in the ingredient name (Title Case), e.g. "White Rice", "Chicken Broth". Only put descriptors in the "name" field if they're required to buy the correct product (e.g. "White Rice (Long-Grain)", "Tomatoes (Fire Roasted)", "Chicken Broth (Low-Sodium)"). Everything else — state, prep instructions, or notes like "uncooked", "rinsed until water runs clear", "diced", "melted", "room temperature" — goes in the "notes" field instead, never the name.

INTEGRATED COOKING TIMELINE: Instead of simple numbered steps, create a fully detailed, minute-by-minute cooking timeline for someone with zero cooking experience who should never need to leave this page or search anything else up. Each entry in the "steps" array must be a single string starting with a time range like "00:00-00:05 - " followed by the instruction (use MM:SS format, cumulative from the start of cooking). Explain every technique in plain language — never assume the reader knows what a term means (e.g. explain what "fold," "deglaze," or "simmer" means the first time it's used). The very first time block must be "00:00-0X:XX - Gather all ingredients:" followed by a newline-separated bullet list of every ingredient formatted exactly like "- [amount] [unit] — [name]" (one per line). Whenever a step uses an ingredient, mention its exact amount inline in that step's text so the user never needs to scroll back to the ingredients list. Keep time blocks realistic and sequential, accounting for both active and passive/waiting time.`;
  try{
    const pageText = await fetchPageContent(url);
    let text;
    if(pageText){
      statusEl.innerHTML = '<div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Extracting the recipe…</div>';
      const prompt = `Here is the text content of a recipe webpage at ${url}:
"""
${pageText}
"""
Extract the recipe from this text and respond with ONLY the raw JSON object below — no preamble, no markdown fences, nothing before or after the JSON itself:
{"title":"...", "category":"one of Breakfast/Lunch/Dinner/Side Dishes/Appetizers/Snacks/Desserts", "origin":"cuisine origin", "protein":"main protein or Vegetarian", "prepTime":"e.g. 15 min", "cookTime":"e.g. 30 min", "totalTime":"e.g. 45 min", "ingredients":[{"amount":"1","unit":"cup","name":"rice","notes":""}], "steps":["00:00-00:05 - ...","..."]}
Keep the recipe title free of marketing language like "easy" or "best ever" — just the name of the dish. Base this strictly on the text provided; do not invent details that aren't there.
${formatInstructions}`;
      text = await callClaudeWithRetry(prompt, false, 1);
    } else {
      statusEl.innerHTML = '<div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Couldn\'t read the page directly — trying a web search instead (this can take a bit longer)…</div>';
      const prompt = `Use web search to find and read the recipe at this URL: ${url}
Once you have the information, respond with ONLY the raw JSON object below — no preamble, no explanation of your search process, no markdown fences, nothing before or after the JSON itself:
{"title":"...", "category":"one of Breakfast/Lunch/Dinner/Side Dishes/Appetizers/Snacks/Desserts", "origin":"cuisine origin", "protein":"main protein or Vegetarian", "prepTime":"e.g. 15 min", "cookTime":"e.g. 30 min", "totalTime":"e.g. 45 min", "ingredients":[{"amount":"1","unit":"cup","name":"rice","notes":""}], "steps":["00:00-00:05 - ...","..."]}
Keep the recipe title free of marketing language like "easy" or "best ever" — just the name of the dish. Base this strictly on what you find at the URL.
${formatInstructions}`;
      text = await callClaudeWithRetry(prompt, true, 1);
    }
    const parsed = parseJsonLoose(text);
    statusEl.innerHTML = '<div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Grabbing the recipe photo…</div>';
    let headerImage = '';

    if(!headerImage) headerImage = parsed.headerImage||'';
    const newRecipe = {

      <span class="name">${esc(f.name)}</span>

  function titleCase(str){
    if(!str) return str;
    const lower = new Set(['a','an','and','the','of','in','on','for','with','to','or']);
    return str.split(' ').map((w,idx)=>{
      if(!w) return w;
      if(idx>0 && lower.has(w.toLowerCase())) return w.toLowerCase();
      return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
    }).join(' ');
  }
  const ingRows = r.ingredients.map(i=>`<tr><td>${esc(i.amount)} ${esc(i.unit||'')}</td><td>${esc(titleCase(i.name))}</td><td>${esc(i.notes||'')}</td></tr>`).join('');

  if(genBtn){ genBtn.onclick = async ()=>{
    const statusEl = document.getElementById('healthyStatus');
    statusEl.innerHTML = '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Working on a healthier version…</div>';
    try{
      const prompt = `Here is a recipe:
Title: ${r.title}
Ingredients: ${r.ingredients.map(i=>`${i.amount} ${i.unit} ${i.name} ${i.notes}`).join('; ')}
Steps: ${r.steps.map(s=>s.instruction).join(' ')}

Create a lower-calorie, healthier version of this recipe if reasonably possible (ingredient swaps, portion or technique changes). If it is NOT reasonably possible to make a meaningfully healthier version (e.g. it's already a light dish, or it's a dessert where "healthy" doesn't meaningfully apply), respond with exactly: {"possible": false, "reason": "short explanation"}
Otherwise respond with ONLY raw JSON (no markdown fences): {"possible": true, "title":"...", "ingredients":[{"amount":"1","unit":"cup","name":"...","notes":"..."}], "steps":["00:00-00:05 - ...","..."]}
Follow the same formatting rules: Title Case ingredient names with only purchase-critical descriptors in parentheses in the name (prep notes go in "notes" instead), and write steps as a full minute-by-minute Integrated Cooking Timeline the way a beginner could follow with no outside help, embedding ingredient amounts directly in the relevant steps.`;
      const text = await callClaude(prompt, false);
      const parsed = parseJsonLoose(text);
      if(!parsed.possible){
        statusEl.innerHTML = `<div class="disclaimer" style="margin-top:8px;">Pour couldn't make a meaningfully healthier version of this one: ${esc(parsed.reason||'not applicable for this recipe.')}</div>`;

        id:uid(), title:parsed.title || (r.title+' (Healthy)'), sourceUrl:r.sourceUrl,

        prepTime:r.prepTime, cookTime:r.cookTime, totalTime:r.totalTime,
        headerImage:r.headerImage||'',
        ingredients:(parsed.ingredients||[]).map(i=>({id:uid(), amount:i.amount||'', unit:i.unit||'', name:i.name||'', notes:i.notes||''})),
        steps:(parsed.steps||[]).map(s=>({id:uid(), instruction: typeof s==='string'?s:(s.instruction||'')})),
        tags:[...(r.tags||[])], equipment:[...(r.equipment||[])], sides:[...(r.sides||[])],
        nutrition:null, favorites:[], notes:[], isHealthyVersion:true, healthyVersionOf:r.id, healthyVersionId:null, createdAt:Date.now(),
      };
      state.recipes.push(healthyRecipe);
      r.healthyVersionId = healthyRecipe.id;
      saveState(); render();
    }catch(e){
      statusEl.innerHTML = `<div class="err-msg">Couldn't generate a healthy version (${esc(e.message)}). Try again in a moment.</div>`;
    }
  }; }

  const nutBtn = document.getElementById('estimateNutritionBtn');
  if(nutBtn){ nutBtn.onclick = async ()=>{
    const statusEl = document.getElementById('nutritionStatus');
    statusEl.innerHTML = '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Estimating…</div>';
    try{
      const prompt = `Estimate rough per-serving nutrition for this recipe. Ingredients: ${r.ingredients.map(i=>`${i.amount} ${i.unit} ${i.name}`).join('; ')}. Assume 4 servings unless the ingredients clearly suggest otherwise.
Respond with ONLY raw JSON (no markdown fences): {"calories":"340","protein":"38g","carbs":"4g","fat":"19g","fiber":"1g","sodium":"320mg","servingSize":"1 serving"}`;
      const text = await callClaude(prompt, false);
      const parsed = parseJsonLoose(text);
      r.nutrition = parsed;
      saveState(); render();
    }catch(e){
      statusEl.innerHTML = `<div class="err-msg">Couldn't estimate nutrition (${esc(e.message)}).</div>`;

function calcAgeFromBirthday(birthdayIso){
  if(!birthdayIso) return null;
  const bd = new Date(birthdayIso + 'T00:00:00');
  if(isNaN(bd.getTime())) return null;
  const now = new Date();
  let totalMonths = (now.getFullYear()-bd.getFullYear())*12 + (now.getMonth()-bd.getMonth());
  if(now.getDate() < bd.getDate()) totalMonths--;
  if(totalMonths < 0) totalMonths = 0;
  if(totalMonths < 24) return {value: totalMonths, unit:'months'};
  return {value: Math.floor(totalMonths/12), unit:'years'};
}
function ageLabel(f){
  const a = calcAgeFromBirthday(f.birthday);
  if(!a) return '';
  if(a.unit==='months') return a.value + (a.value===1?' month old':' months old');
  return a.value + (a.value===1?' year old':' years old');
}
function famMetaLine(f){
  const parts = [];
  parts.push(typeLabel(f.type));
  const al = ageLabel(f);
  if(al) parts.push(al);
  if(isPet(f) && f.weightLbs) parts.push(f.weightLbs+' lbs');
  if(f.allergies && f.allergies.length) parts.push('Allergies: '+f.allergies.join(', '));
  return parts.join(' · ');
}

  document.getElementById('saveNicknameBtn').onclick = ()=>{
    state.userNickname = document.getElementById('nicknameInput').value.trim();
    saveState(); render();
  };
  document.getElementById('downloadBackupBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pour-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const fileInput = document.getElementById('restoreFileInput');
  document.getElementById('restoreBackupBtn').onclick = ()=> fileInput.click();
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('restoreStatus');
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const restored = JSON.parse(reader.result);
        if(!restored || typeof restored !== 'object' || !Array.isArray(restored.familyMembers)){
          throw new Error('That does not look like a Pour backup file.');
        }
        showConfirmModal('This will replace everything currently in the app with your backup. Continue?', ()=>{
          state = restored;
          migrateState();
          saveState(); render();
          showToast('✓ Backup restored.', 3000);
        }, 'Restore');
      }catch(err){
        statusEl.innerHTML = `<div class="err-msg" style="margin-top:8px;">Couldn't restore that file (${esc(err.message)}).</div>`;
      }
      fileInput.value = '';
    };
    reader.readAsText(file);
  };
  document.querySelectorAll('[data-del-fam]').forEach(b=> b.onclick=()=>{
    const f = state.familyMembers.find(x=>x.id===b.dataset.delFam);

    const f = state.familyMembers.find(x=>x.id===b.dataset.editFam);

}

/* ============================= UTIL & WIRING ============================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }

function attachViewHandlers(view){
  if(view==='dashboard') attachDashboardHandlers();
  else if(view==='recipes') attachRecipesHandlers();
  else if(view==='recipe-detail') attachRecipeDetailHandlers();
  else if(view==='inventory') attachInventoryHandlers();
  else if(view==='mealplan') attachMealPlanHandlers();
  else if(view==='settings') attachSettingsHandlers();
  else if(view==='shopping') attachShoppingHandlers();
  else if(view==='prepday') attachPrepDayHandlers();
  else if(view==='firstfoods') attachFirstFoodsHandlers();
  else if(view==='seasonal') attachSeasonalHandlers();
}

/* ============================= SHOPPING LIST ============================= */
const SHOP_CATS = ['Produce','Meat','Pantry','Seasonings'];
function renderShopping(){
  const rows = SHOP_CATS.map(cat=>{
    const items = state.shoppingList.filter(i=>i.category===cat);
    if(!items.length) return '';
    return `<div class="cat-label">${cat}</div>` + items.map(i=>`
      <div class="shop-row">
        <button class="shop-check ${i.checked?'done':''}" data-shop-check="${i.id}">${i.checked?'✓':''}</button>
        <div class="shop-name ${i.checked?'done':''}">${esc(i.name)}${i.amount? ' — '+esc(i.amount) : ''}</div>
        <button class="btn btn-danger btn-sm" data-shop-del="${i.id}">✕</button>
      </div>`).join('');
  }).join('');
  const lowStockCount = state.inventory.filter(i=>Number(i.amount)<=1).length;

  return `
    <div class="row between" style="margin-bottom:16px;">
      <h2 class="fdisp" style="font-size:30px;margin:0;">Shopping List</h2>
      <div class="row gap8">
        <button class="btn btn-secondary" id="addLowStockBtn">+ Add Low Stock (${lowStockCount})</button>
        <button class="btn btn-primary" id="addShopBtn">+ Add Item</button>
      </div>
    </div>
    ${rows || `<div class="empty-state"><div class="big">List's empty</div>Add an item or pull in your low-stock must-haves.</div>`}
  `;
}
function attachShoppingHandlers(){
  document.querySelectorAll('[data-shop-check]').forEach(b=> b.onclick=()=>{
    const item = state.shoppingList.find(i=>i.id===b.dataset.shopCheck); item.checked=!item.checked; saveState(); render();
  });
  document.querySelectorAll('[data-shop-del]').forEach(b=> b.onclick=()=>{
    state.shoppingList = state.shoppingList.filter(i=>i.id!==b.dataset.shopDel); saveState(); render();
  });
  document.getElementById('addLowStockBtn').onclick = ()=>{
    const low = state.inventory.filter(i=>Number(i.amount)<=1);
    low.forEach(i=>{
      const exists = state.shoppingList.some(s=> s.name.toLowerCase()===i.name.toLowerCase() && !s.checked);
      if(!exists) state.shoppingList.push({id:uid(), name:i.name, category: i.subCategory==='Seasoning' ? 'Seasonings' : 'Pantry', amount:'', checked:false});
    });
    saveState(); render();
  };
  document.getElementById('addShopBtn').onclick = ()=>{
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <button class="close-x" id="modalClose">✕</button>
          <div class="modal-title">Add Item</div>
          <label class="field-label">Name</label>
          <input class="field" id="s_name" style="margin-bottom:10px;">
          <div class="grid2">
            <div><label class="field-label">Category</label>
              <select class="field" id="s_cat">${SHOP_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
            </div>
            <div><label class="field-label">Amount</label><input class="field" id="s_amount" placeholder="2 cups"></div>
          </div>
          <button class="btn btn-primary" id="saveShopBtn" style="width:100%;margin-top:14px;">Save</button>
        </div>
      </div>`;
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalOverlay').onclick=(e)=>{ if(e.target.id==='modalOverlay') closeModal(); };
    document.getElementById('saveShopBtn').onclick = ()=>{
      const name = document.getElementById('s_name').value.trim(); if(!name) return;
      state.shoppingList.push({id:uid(), name, category:document.getElementById('s_cat').value, amount:document.getElementById('s_amount').value.trim(), checked:false});
      saveState(); closeModal(); render();
    };
  };
}

/* ============================= PREP DAY MODE ============================= */
function weekDates(anchorIso){
  const anchor = new Date(anchorIso || todayISO());
  const start = new Date(anchor); start.setDate(anchor.getDate() - anchor.getDay());
  const out=[]; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); out.push(d); }
  return out;
}
function weekMealsSummary(){
  const days = weekDates();
  const items=[];
  days.forEach(d=>{
    const iso = d.toISOString().slice(0,10);
    const entry = state.mealPlan[iso];
    if(!entry) return;
    ['breakfast','lunch','dinner'].forEach(slot=>{
      const rid = entry[slot] && entry[slot].main;
      if(rid){
        const r = state.recipes.find(x=>x.id===rid);
        if(r) items.push({day:d.toLocaleDateString(undefined,{weekday:'long'}), slot, recipe:r});
      }
    });
  });
  return items;
}
function renderPrepDay(){
  const meals = weekMealsSummary();
  const plan = state.ui.prepPlan;
  return `
    <h2 class="fdisp" style="font-size:30px;margin:0 0 6px;">Prep Day Mode</h2>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">Based on this week's meal plan · ${meals.length} meal${meals.length===1?'':'s'} scheduled</div>

    <div class="section-label">This Week's Meals</div>
    <div class="card" style="margin-bottom:18px;">
      ${meals.length ? meals.map(m=>`<div class="stock-row"><span>${m.day} · ${m.slot}</span><span class="fhand">${esc(m.recipe.title)}</span></div>`).join('')
        : '<div style="color:var(--ink-soft);font-size:13px;">Nothing planned yet — add meals to the calendar first.</div>'}
    </div>

    ${meals.length ? `<button class="btn btn-primary" id="genPrepBtn">✨ Generate Prep Timeline</button><div id="prepStatus"></div>` : ''}

    ${plan ? `
      <div style="margin-top:20px;">
        <div class="section-label">Prep Timeline</div>
        <div class="card" style="margin-bottom:18px;">
          ${plan.steps.map((s,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${esc(s)}</div></div>`).join('')}
        </div>
        <div class="section-label">Storage Breakdown</div>
        <div class="grid2">
          <div class="storage-col"><div class="h">Freezer</div>${(plan.freezer||[]).map(i=>`<div class="item">${esc(i)}</div>`).join('') || '<div class="item" style="color:var(--ink-soft);">Nothing</div>'}</div>
          <div class="storage-col"><div class="h">Fridge</div>${(plan.fridge||[]).map(i=>`<div class="item">${esc(i)}</div>`).join('') || '<div class="item" style="color:var(--ink-soft);">Nothing</div>'}</div>
        </div>
      </div>
    ` : ''}
  `;
}
function attachPrepDayHandlers(){
  const btn = document.getElementById('genPrepBtn');
  if(!btn) return;
  btn.onclick = async ()=>{
    const statusEl = document.getElementById('prepStatus');
    statusEl.innerHTML = '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);"><span class="spinner"></span> Building your prep plan…</div>';
    try{
      const meals = weekMealsSummary();
      const desc = meals.map(m=>`${m.day} ${m.slot}: ${m.recipe.title} — ingredients: ${m.recipe.ingredients.map(i=>`${i.amount} ${i.unit} ${i.name}`).join(', ')}`).join('\n');
      const prompt = `Here is a family's meal plan for the week:\n${desc}\n\nCreate a consolidated Sunday prep-day plan. Group similar tasks together (e.g. chop all vegetables at once, marinate proteins together, assemble freezer meals). Also list which prepped items should go in the freezer vs the fridge.
Respond with ONLY raw JSON (no markdown fences): {"steps":["Chop all vegetables for the week","Marinate chicken and turkey together","..."], "freezer":["item + note"], "fridge":["item + note"]}`;
      const text = await callClaude(prompt, false);
      const parsed = parseJsonLoose(text);
      state.ui.prepPlan = parsed;
      saveState(); render();
    }catch(e){
      statusEl.innerHTML = `<div class="err-msg">Couldn't build a prep plan (${esc(e.message)}).</div>`;
    }
  };
}

/* ============================= FIRST FOODS CHECKLIST ============================= */
function renderFirstFoods(){
  const total = state.firstFoods.length;
  const done = state.firstFoods.filter(f=>f.dateGiven).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const cats = [...new Set(state.firstFoods.map(f=>f.category))];
  const rows = cats.map(cat=>{
    const items = state.firstFoods.filter(f=>f.category===cat);
    return `<div class="cat-label">${esc(cat)}</div>` + items.map(f=>`
      <div class="shop-row">
        <button class="shop-check ${f.dateGiven?'done':''}" data-food-toggle="${f.id}">${f.dateGiven?'✓':''}</button>
        <div class="shop-name ${f.dateGiven?'done':''}" style="flex:1;">${esc(f.name)}</div>
        <input type="date" class="food-date-input" data-food-date="${f.id}" value="${f.dateGiven||''}">
      </div>`).join('');
  }).join('');

  return `
    <div class="hero" style="background:radial-gradient(120% 130% at 15% 0%, var(--lavender) 0%, var(--cream) 75%);">
      <h1 style="font-size:30px;">First Foods Checklist</h1>
      <div class="sub">${done} of ${total} foods introduced</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>
    ${rows}
  `;
}
function attachFirstFoodsHandlers(){
  document.querySelectorAll('[data-food-toggle]').forEach(b=> b.onclick=()=>{
    const f = state.firstFoods.find(x=>x.id===b.dataset.foodToggle);
    f.dateGiven = f.dateGiven ? '' : todayISO();
    saveState(); render();
  });
  document.querySelectorAll('[data-food-date]').forEach(inp=> inp.onchange=()=>{
    const f = state.firstFoods.find(x=>x.id===inp.dataset.foodDate);
    f.dateGiven = inp.value; saveState(); render();
  });
}

/* ============================= NUTRITION GOALS ============================= */
const VEGGIE_WORDS = ['broccoli','green bean','spinach','carrot','zucchini','pea','cauliflower','beet','pepper','squash','sweet potato','lettuce','kale','tomato','onion','garlic','cucumber'];
const FRUIT_WORDS = ['apple','banana','blueberry','peach','pear','mango','strawberry','watermelon','grape','orange','lemon','avocado','prune'];
function renderNutrition(){
  const meals = weekMealsSummary();
  let proteinG = 0, veggieServings = 0, fruitServings = 0;
  meals.forEach(m=>{
    if(m.recipe.nutrition && m.recipe.nutrition.protein){
      proteinG += parseFloat(m.recipe.nutrition.protein) || 0;
    }
    m.recipe.ingredients.forEach(ing=>{
      const n = (ing.name||'').toLowerCase();
      if(VEGGIE_WORDS.some(w=>n.includes(w))) veggieServings++;
      if(FRUIT_WORDS.some(w=>n.includes(w))) fruitServings++;
    });
  });
  const weekStart = weekDates()[0].toISOString().slice(0,10);
  const weekEnd = weekDates()[6].toISOString().slice(0,10);
  const koraExposures = state.firstFoods.filter(f=> f.dateGiven && f.dateGiven>=weekStart && f.dateGiven<=weekEnd).length;

  const goals = [
    {label:'Protein', have:Math.round(proteinG), target:200, unit:'g'},
    {label:'Veggie servings', have:veggieServings, target:14, unit:''},
    {label:'Fruit servings', have:fruitServings, target:10, unit:''},
    {label:'Kora — new foods exposed', have:koraExposures, target:3, unit:''},
  ];

  return `
    <h2 class="fdisp" style="font-size:30px;margin:0 0 4px;">Nutrition Goals</h2>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">This week, estimated from your meal plan · protein needs nutrition data added to recipes to be accurate</div>
    ${goals.map(g=>{
      const pct = Math.min(100, Math.round((g.have/g.target)*100));
      return `<div class="goal-card">
        <div class="goal-top"><span>${g.label}</span><span class="amt">${g.have}${g.unit} / ${g.target}${g.unit}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>`;
    }).join('')}
    <div class="card" style="margin-top:8px;">
      <div class="section-label" style="margin-bottom:8px;">Gaps &amp; Suggestions</div>
      <div class="fhand" style="font-size:14px;line-height:1.5;">
        ${veggieServings < 14 ? '🥦 Try adding a veggie side to a couple more dinners this week.<br>' : ''}
        ${fruitServings < 10 ? '🍓 A fruit side at breakfast is an easy way to close the gap.<br>' : ''}
        ${koraExposures < 3 ? '🍼 Check the First Foods Checklist for a new food to try with Kora this week.' : 'Nice work keeping variety in the mix this week!'}
      </div>
    </div>
  `;
}

/* ============================= SEASONAL & HOLIDAY ============================= */
const SEASONS = ['Spring','Summer','Fall','Winter'];
const HOLIDAYS = ['New Year',"Valentine's Day","St. Patrick's Day",'Easter','Independence Day','Halloween','Thanksgiving','Christmas'];
function renderSeasonal(){
  const seasonSections = SEASONS.map(s=>{
    const matches = state.recipes.filter(r=> (r.seasonalTags||[]).includes(s));
    return `<div class="cat-label">${s}</div>` + (matches.length ? `<div class="recipe-grid" style="margin-bottom:8px;">${matches.map(r=>`<div class="recipe-tile" data-open-recipe="${r.id}"><div class="img">${imgTag(r.headerImage)}</div><div class="info"><div class="title">${esc(r.title)}</div></div></div>`).join('')}</div>` : `<div style="color:var(--ink-soft);font-size:13px;margin-bottom:8px;">No recipes tagged yet.</div>`);
  }).join('');
  const holidaySections = HOLIDAYS.map(h=>{
    const matches = state.recipes.filter(r=> (r.holidayTags||[]).includes(h));
    if(!matches.length) return '';
    return `<div class="cat-label">${h}</div><div class="recipe-grid" style="margin-bottom:8px;">${matches.map(r=>`<div class="recipe-tile" data-open-recipe="${r.id}"><div class="img">${imgTag(r.headerImage)}</div><div class="info"><div class="title">${esc(r.title)}</div></div></div>`).join('')}</div>`;
  }).join('');

  return `
    <h2 class="fdisp" style="font-size:30px;margin:0 0 16px;">Seasonal &amp; Holiday</h2>
    <div class="section-label">By Season</div>
    ${seasonSections}
    <hr class="dash">
    <div class="section-label">By Holiday</div>
    ${holidaySections || "<div style='color:var(--ink-soft);font-size:13px;'>No holiday-tagged recipes yet — add tags from a recipe's Edit screen.</div>"}
  `;
}
function attachSeasonalHandlers(){
  document.querySelectorAll('[data-open-recipe]').forEach(b=> b.onclick=()=> setView('recipe-detail',{currentRecipeId:b.dataset.openRecipe}));
}

loadState();
</script>
